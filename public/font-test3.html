<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@900&family=Archivo+Black&family=Bowlby+One&family=Red+Hat+Display:wght@900&family=Baloo+2:wght@800&family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>
  body { background:#367e26; padding:20px; font-family:sans-serif; }
  .ref img { image-rendering:pixelated; display:block; }
  .row { display:flex; align-items:center; gap:16px; margin:10px 0; background:#2d6b1f; padding:10px 12px; border-radius:4px; }
  .label { color:#ddd; font-size:12px; width:140px; flex-shrink:0; }
  .sample { color:#fbe306; font-size:56px; letter-spacing:-2px; line-height:1; }
</style>
</head>
<body>
<div class="ref"><img src="/gre-zoom.png" /></div>
<div class="row"><div class="label">Rubik (900)</div><div class="sample" style="font-family:'Rubik';font-weight:900">GRE</div></div>
<div class="row"><div class="label">Archivo Black</div><div class="sample" style="font-family:'Archivo Black'">GRE</div></div>
<div class="row"><div class="label">Bowlby One</div><div class="sample" style="font-family:'Bowlby One'">GRE</div></div>
<div class="row"><div class="label">Red Hat Display (900)</div><div class="sample" style="font-family:'Red Hat Display';font-weight:900">GRE</div></div>
<div class="row"><div class="label">Baloo 2 (800)</div><div class="sample" style="font-family:'Baloo 2';font-weight:800">GRE</div></div>
<div class="row"><div class="label">Fredoka (700)</div><div class="sample" style="font-family:'Fredoka';font-weight:700">GRE</div></div>
</body>
</html>
