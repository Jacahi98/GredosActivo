<!doctype html>
<html>
<head><meta charset="utf-8"><title>compare</title>
<style>
  body { background:#333; display:flex; flex-direction:column; gap:16px; padding:24px; align-items:center; font-family:sans-serif; color:#fff; }
  .stage { position:relative; width:90vw; max-width:960px; aspect-ratio:206/108; background:#fff; box-shadow:0 0 0 1px #000; }
  .stage img, .stage object { position:absolute; top:0; left:0; width:100%; height:100%; display:block; }
  .stage object { opacity: var(--overlay-opacity, 1); transition: opacity .15s; }
  .controls { display:flex; gap:12px; align-items:center; }
  button { font-size:14px; padding:8px 14px; cursor:pointer; }
  input[type=range] { width:200px; }
  #label { min-width:90px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <img src="/brand/logo-original.png" />
  <object type="image/svg+xml" data="/logo-traced-preview.svg"></object>
</div>
<div class="controls">
  <button id="toggle">Ocultar trazado</button>
  <input type="range" id="opacity" min="0" max="100" value="100" />
  <span id="label">100% overlay</span>
</div>
<script>
  const stage = document.getElementById('stage');
  const toggle = document.getElementById('toggle');
  const opacity = document.getElementById('opacity');
  const label = document.getElementById('label');
  let visible = true;
  toggle.addEventListener('click', () => {
    visible = !visible;
    stage.style.setProperty('--overlay-opacity', visible ? (opacity.value / 100) : 0);
    toggle.textContent = visible ? 'Ocultar trazado' : 'Mostrar trazado';
  });
  opacity.addEventListener('input', () => {
    label.textContent = opacity.value + '% overlay';
    if (visible) stage.style.setProperty('--overlay-opacity', opacity.value / 100);
  });
</script>
</body>
</html>
